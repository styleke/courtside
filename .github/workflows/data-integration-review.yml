name: Review official schedule integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/data-integration-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect bounded public documents; do not edit the public feed
        run: |
          node --input-type=module <<'NODE'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {assertFreeBuild} from './scripts/free-build-guard.mjs';
          await assertFreeBuild(process.cwd());await mkdir('phase2/integration-review',{recursive:true});
          const urls=[
            ['shanghai-robots','https://en.rolexshanghaimasters.com/robots.txt'],
            ['shanghai-schedule','https://en.rolexshanghaimasters.com/en/scores/schedule'],
            ['shanghai-next','https://en.rolexshanghaimasters.com/en/scores/schedule?dayToDisplay=8'],
            ['shanghai-results','https://en.rolexshanghaimasters.com/en/scores/results'],
            ['beijing-robots','https://www.chinaopen.com/robots.txt'],
            ['beijing-home','https://www.chinaopen.com/cn/'],
            ['sportscore-bracket','https://sportscore.com/api/widget/bracket/?sport=tennis&slug=atp-shanghai-china-men-singles'],
            ['sportscore-fixtures','https://sportscore.com/api/v1/fixtures/?sport=tennis&date=2026-10-11&limit=200']
          ];
          const report={startedAt:new Date().toISOString(),publicDataWritten:false,requests:[]};
          for(const [id,url] of urls){const row={id,url};try{const r=await fetch(url,{headers:{'User-Agent':'CourtsideReview/1.0 (https://courtside-tennis.pages.dev/; bounded user-requested review)'},redirect:'error',signal:AbortSignal.timeout(12000)});row.status=r.status;row.type=r.headers.get('content-type');if(r.ok){const text=await r.text();if(Buffer.byteLength(text)>2000000)throw Error('Response exceeds review limit');row.bytes=Buffer.byteLength(text);row.sha256=createHash('sha256').update(text).digest('hex');await writeFile('phase2/integration-review/'+id+'.txt',text);}else await r.body?.cancel();}catch(e){row.error=e.message;}report.requests.push(row);await new Promise(r=>setTimeout(r,700));}
          report.finishedAt=new Date().toISOString();await writeFile('phase2/integration-review/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          NODE
      - run: git diff --exit-code -- data config public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-schedule-review
          path: phase2/integration-review
          retention-days: 1
