name: Review missing player information
on:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-completeness-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-profile-review
  cancel-in-progress: false
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Snapshot and inspect player completeness
        run: |
          mkdir -p /tmp/profile-review
          git archive --format=zip HEAD > /tmp/profile-review/source.zip
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const data=JSON.parse(await readFile('data/content.json','utf8'));
          const manifest=JSON.parse(await readFile('public/player-photos.json','utf8'));
          const upcoming=data.matches.filter(m=>JSON.stringify(m).includes('2026-10-11')||JSON.stringify(m).includes('2026-10-12'));
          const used=new Set(data.players.filter(p=>upcoming.some(m=>JSON.stringify(m).includes('"'+p.id+'"'))).map(p=>p.id));
          const rows=data.players.map(p=>({id:p.id,name:p.name,enName:p.enName,country:p.country,birthDate:p.birthDate,rank:p.rank,doublesRank:p.doublesRank,sourceIds:p.sourceIds,sourceUrl:p.sourceUrl,identitySources:p.identitySources,hasPhoto:!!manifest.photos[p.id],currentMatch:used.has(p.id),needsChinese:!/[\u3400-\u9fff]/.test(p.name||'')}));
          await writeFile('/tmp/profile-review/audit.json',JSON.stringify({at:new Date().toISOString(),commit:process.env.GITHUB_SHA,total:rows.length,rows},null,2));
          await writeFile('/tmp/profile-review/original-content.json',JSON.stringify(data));
          await writeFile('/tmp/profile-review/original-manifest.json',JSON.stringify(manifest));
          const missing=data.players.filter(p=>!manifest.photos[p.id]).sort((a,b)=>Number(used.has(b.id))-Number(used.has(a.id))).slice(0,32);
          await writeFile('/tmp/profile-review/missing.json',JSON.stringify(missing,null,2));
          data.players=missing;await writeFile('data/content.json',JSON.stringify(data));
          console.log(JSON.stringify({players:rows.length,missingPhotos:rows.filter(p=>!p.hasPhoto).length,missingChinese:rows.filter(p=>p.needsChinese).length,candidates:missing.map(p=>p.id)},null,2));
          NODE
      - name: Fetch only missing openly licensed photo candidates into the review workspace
        continue-on-error: true
        run: node scripts/import-player-portraits.mjs
      - name: Save candidates and bounded identity labels for editorial review
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir,copyFile} from 'node:fs/promises';
          const out='/tmp/profile-review';const original=JSON.parse(await readFile(out+'/original-manifest.json','utf8'));const candidates=JSON.parse(await readFile('public/player-photos.json','utf8'));
          const additions=Object.fromEntries(Object.entries(candidates.photos).filter(([id])=>!original.photos[id]));
          await mkdir(out+'/candidates',{recursive:true});
          for(const p of Object.values(additions)){const name=p.src.split('/').at(-1);await copyFile('public/'+p.src,out+'/candidates/'+name);}
          await writeFile(out+'/candidate-photos.json',JSON.stringify({photos:additions},null,2));
          try{await copyFile('phase1/photo-import.json',out+'/photo-import.json');}catch{}
          const missing=JSON.parse(await readFile(out+'/missing.json','utf8'));const qs=[...new Set(missing.map(p=>additions[p.id]?.wikidataId||p.wikidataId||p.birthDateSource?.wikidataId).filter(x=>/^Q\d+$/.test(x||'')))];
          if(qs.length){const u='https://www.wikidata.org/w/api.php?'+new URLSearchParams({action:'wbgetentities',format:'json',ids:qs.join('|'),props:'labels|aliases|descriptions|claims',languages:'en|mul|zh|zh-hans|zh-cn|zh-hant',maxlag:'5'});try{const r=await fetch(u,{headers:{'User-Agent':'CourtsideEditorialReview/1.0 (https://github.com/styleke/courtside)'},signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('HTTP '+r.status);await writeFile(out+'/identity-labels.json',await r.text());}catch(e){await writeFile(out+'/identity-error.txt',String(e));}}
          console.log(JSON.stringify({productionDataWritten:false,candidatePhotos:Object.keys(additions)},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-player-information-review
          path: /tmp/profile-review/
          retention-days: 1
          compression-level: 6
