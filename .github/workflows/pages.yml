name: Publish Courtside
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'public/**'
      - 'data/**'
      - 'scripts/**'
      - 'services/**'
      - 'adapters/**'
      - 'config/**'
      - 'tests/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: courtside-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
