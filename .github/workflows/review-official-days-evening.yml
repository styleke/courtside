name: Review dated official schedules
on:
  push:
    branches: ['review/official-days-20261013-evening']
permissions:
  contents: read
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8bc1cc16932f415be695ab2194c05aee60582580
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check published data and branded page code without changing anything
        shell: bash
        run: |
          mkdir -p phase2/wuhan-publication
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import Core from './public/core.js';
          import Runtime from './public/runtime.js';
          const expected=JSON.parse(await readFile('data/content.json','utf8'));
          const expectedPublic=Runtime.publicData(expected);
          const origin='https://courtside-tennis.pages.dev';
          const report={commit:'8bc1cc16932f415be695ab2194c05aee60582580',startedAt:new Date().toISOString(),requests:0,attempts:[],verified:false,fullAutomaticCoverage:false};
          const hash=t=>createHash('sha256').update(t).digest('hex');
          const coreHash=hash(await readFile('public/core.js'));
          const appHash=hash(await readFile('public/app.js'));
          async function read(url){
            if(++report.requests>24)throw Error('request-limit');
            const r=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(10000)});
            if(!r.ok){await r.body?.cancel();throw Error('http-'+r.status);}
            const reader=r.body.getReader(),parts=[];let bytes=0;
            for(;;){const {done,value}=await reader.read();if(done)break;bytes+=value.length;if(bytes>2000000){await reader.cancel();throw Error('size-limit');}parts.push(Buffer.from(value));}
            return Buffer.concat(parts).toString('utf8');
          }
          for(let attempt=0;attempt<6;attempt++){
            try{
              const q='?publication='+process.env.GITHUB_RUN_ID+'-'+attempt;
              const [config,core,app,body]=await Promise.all([
                read(origin+'/site-config.js'+q),read(origin+'/core.js'+q),read(origin+'/app.js'+q),
                read('https://styleke.github.io/courtside/data/content.json'+q)
              ]);
              assert.match(config,/publicDataOrigin:'github-pages'/);
              assert.equal(hash(core),coreHash,'Branded core code must match release');
              assert.equal(hash(app),appHash,'Branded app code must match release');
              const data=JSON.parse(body);
              assert.ok(data.meta.revision>=27);assert.deepEqual(data.rankings,expectedPublic.rankings);
              const ms=data.matches.filter(m=>m.tournamentId==='wuhan-2026');
              const tomorrow=ms.filter(m=>Core.matchDate(m)==='2026-10-14');
              assert.equal(tomorrow.length,20);assert.equal(tomorrow.filter(m=>m.discipline==='单打').length,14);
              assert.equal(ms.filter(m=>Core.matchDate(m)==='2026-10-13'&&m.status==='finished').length,3);
              for(const id of ['karolina-muchova','nikola-bartunkova']){
                const m=tomorrow.find(m=>m.discipline==='单打'&&m.sides.flat().includes(id));
                assert.equal(m.startAt,null);assert.equal(m.timeKind,'following');assert.equal(m.courtOrder,2);assert.equal(Core.followed(m,data),true);
              }
              assert.equal(tomorrow.filter(m=>m.afterRest).length,4);
              const waiting=tomorrow.find(m=>m.afterRest&&m.timeKind==='dateOnly');assert.equal(waiting.court,null);assert.equal(waiting.startAt,null);
              const coverage=data.meta.scheduleCoverage.filter(r=>r.tournamentId==='wuhan-2026');
              assert.equal(coverage.length,1);assert.equal(coverage[0].sourceDate,'2026-10-14');assert.equal(coverage[0].expectedMatches,20);
              report.attempts.push({attempt:attempt+1,success:true});
              Object.assign(report,{verified:true,verifiedAt:new Date().toISOString(),revision:data.meta.revision,wuhanTomorrow:20,wuhanSingles:14,wuhanDoubles:6,wuhanTodayVerifiedResults:3,followedPlayersVerified:true,restConditionsVerified:true,officialPartialCoveragePreserved:true,brandedCoreHash:coreHash,brandedAppHash:appHash,rankingsUnchanged:true});
              break;
            }catch(e){report.attempts.push({attempt:attempt+1,success:false,error:String(e.message).slice(0,180)});if(attempt<5)await new Promise(r=>setTimeout(r,20000));}
          }
          await writeFile('phase2/wuhan-publication/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          assert.equal(report.verified,true,'Live publication not verified');
          JS
      - name: No data, configuration or workflow writes
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuhan-publication-verification
          path: phase2/wuhan-publication
          retention-days: 1
