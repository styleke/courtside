name: Review real clock seconds
on:
  push:
    branches: ['review/clock-seconds-20261013']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6d60d82a71e3faf71e6a86e9b5d4f8de28a4ab49
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Capture exact candidate before tests
        shell: bash
        run: |
          mkdir -p phase2/clock-seconds-review
          git rev-parse HEAD > phase2/clock-seconds-review/commit.txt
          git diff --exit-code
          cp package.json phase2/clock-seconds-review/package.json
          sha256sum services/clock-evidence.mjs services/operation-health.mjs tests/clock-jitter.test.cjs ops/cloudflare-clock/seconds.md > phase2/clock-seconds-review/before.sha256
      - name: Run full regression suite without source mutation
        shell: bash
        run: |
          npm test | tee phase2/clock-seconds-review/tests.txt
          git diff --exit-code
      - name: Build exact candidate
        shell: bash
        run: npm run build | tee phase2/clock-seconds-review/build.txt
      - name: Verify derived seed before discarding only that build output
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import Runtime from './public/runtime.js';
          const path='public/data.js';
          const input=JSON.parse(execFileSync('git',['show','HEAD:data/content.json'],{encoding:'utf8'}));
          assert.deepEqual(JSON.parse(await readFile('data/content.json','utf8')),input);
          const data=Runtime.publicData(input);
          const expected='window.COURTSIDE_SEED = '+JSON.stringify(data).replace(/</g,'\\u003c')+';';
          assert.equal(await readFile(path,'utf8'),expected,'Build seed must exactly match committed factual input');
          assert.equal(await readFile('dist/site/data.js','utf8'),expected);
          assert.deepEqual(JSON.parse(await readFile('dist/site/data/content.json','utf8')),data);
          await writeFile(path,execFileSync('git',['show','HEAD:'+path]));
          console.log('Verified derived public seed against committed input; discarded only regenerated seed.');
          JS
      - name: Verify status and complete tracked-file integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('phase2/clock-seconds-review')
          path='data/automation-status.json'
          original=subprocess.check_output(['git','show','HEAD:'+path])
          before=json.loads(original);after=json.loads(Path(path).read_bytes())
          before.pop('generatedAt',None);after.pop('generatedAt',None)
          assert before==after,'Unexpected status change beyond generatedAt'
          Path(path).write_bytes(original)
          patch=subprocess.check_output(['git','diff','--binary'])
          (root/'after-build.patch').write_bytes(patch)
          assert not patch,'Unexpected tracked-file changes'
          report={'testedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'fullTestsPassed':True,'buildPassed':True,'trackedFilesUnchanged':True,'generatedSeedVerified':True,'published':False,'liveCronAcceptance':False}
          (root/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
          sha256sum -c phase2/clock-seconds-review/before.sha256
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtside-clock-seconds-reviewed
          path: phase2/clock-seconds-review
          retention-days: 1
