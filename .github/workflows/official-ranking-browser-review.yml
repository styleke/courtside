name: Read official ranking dates in browser
on:
  push:
    branches: [main]
    paths: ['.github/workflows/official-ranking-browser-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-official-ranking-browser
  cancel-in-progress: false
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - name: Read a public WTA ranking list and the ATP reports link; stop at access restrictions
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import {mkdir,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const out='/tmp/official-ranking-browser';await mkdir(out,{recursive:true});const browser=await chromium.launch();const report={startedAt:new Date().toISOString(),publicDataChanged:false,automatedCollectorEnabled:false,pages:[]};
          try{
            const p=await browser.newPage({viewport:{width:1440,height:1050}});
            const url='https://www.wtatennis.com/rankings/singles';const entry={url,startedAt:new Date().toISOString()};
            try{
              const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000});entry.status=r.status();if(r.status()!==200)throw Error('HTTP '+r.status());
              await p.locator('.js-player-item-favourite').first().waitFor({timeout:20000});
              const consent=p.locator('#onetrust-reject-all-handler');if(await consent.isVisible())await consent.click();
              entry.beforeCount=await p.locator('.js-player-item-favourite').count();entry.beforeDate=await p.locator('section.js-rankings').getAttribute('data-date');
              await writeFile(out+'/wta-before.html',await p.content());await p.screenshot({path:out+'/wta-before.png'});
              const button=p.locator('.js-load-more');if(await button.isVisible()){
                await button.scrollIntoViewIfNeeded();await button.click({timeout:10000});
                await p.waitForFunction(()=>document.querySelectorAll('.js-player-item-favourite').length>=100,{},{timeout:25000});
              }
              entry.afterCount=await p.locator('.js-player-item-favourite').count();entry.afterDate=await p.locator('section.js-rankings').getAttribute('data-date');
              entry.rows=await p.locator('.js-player-item-favourite').evaluateAll(rows=>rows.map(r=>({text:r.innerText,attributes:Object.fromEntries([...r.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value])),links:[...r.querySelectorAll('a[href]')].map(a=>({text:a.innerText,href:a.getAttribute('href')}))})));
              const html=await p.content();await writeFile(out+'/wta-after.html',html);entry.sha256=createHash('sha256').update(html).digest('hex');
              await p.locator('.js-player-item-favourite').nth(Math.min(88,entry.afterCount-1)).scrollIntoViewIfNeeded();await p.screenshot({path:out+'/wta-last50.png'});
            }catch(e){entry.error=String(e.message).slice(0,300);await writeFile(out+'/wta-partial.html',await p.content());}
            entry.finishedAt=new Date().toISOString();report.pages.push(entry);
            const atp={url:'https://www.atptour.com/en/media/rankings-and-stats',startedAt:new Date().toISOString()};
            try{const r=await p.goto(atp.url,{waitUntil:'domcontentloaded',timeout:25000});atp.status=r.status();if(r.status()===200){await p.waitForTimeout(1500);const html=await p.content();await writeFile(out+'/atp-media.html',html);atp.links=await p.locator('a[href]').evaluateAll(as=>as.map(a=>({text:a.innerText,href:a.href})).filter(a=>/\.pdf/i.test(a.href)));}else atp.error='Access restricted; no bypass attempted';}catch(e){atp.error=String(e.message).slice(0,200);}
            atp.finishedAt=new Date().toISOString();report.pages.push(atp);
          }finally{await browser.close();report.finishedAt=new Date().toISOString();await writeFile(out+'/browser.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report.pages.map(({rows,links,...x})=>({...x,rows:rows?.length,pdfLinks:links?.length})),null,2));}
          NODE
      - name: No public fields or source permissions can change
        if: always()
        run: git diff --exit-code -- data config public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-ranking-browser-evidence
          path: /tmp/official-ranking-browser/
          retention-days: 1
