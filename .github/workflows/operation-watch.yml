name: Watch Courtside data operation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/operation-watch.yml','services/operation-health.mjs','services/clock-evidence.mjs','scripts/check-clock-trigger.mjs','tests/clock-evidence.test.cjs','scripts/check-operation-health.mjs','tests/operation-health.test.cjs']
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Check tennis data']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-operation-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/operation-health.test.cjs tests/clock-evidence.test.cjs
      - name: Inspect real runs and publication; recover only within a bounded cooldown
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_BOUNDED_RECOVERY: 'true'
          ALLOW_OPERATION_ISSUE: 'true'
        run: node scripts/check-operation-health.mjs
      - name: Monitoring never edits factual website data or collection permissions
        if: always()
        run: git diff --exit-code -- data config public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtside-operation-check
          path: phase2/operation-watch/report.json
          retention-days: 1
