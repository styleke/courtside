name: Phase-one source diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/probe-feasibility.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-feasibility
          path: phase1/source-probe.json
          retention-days: 1
