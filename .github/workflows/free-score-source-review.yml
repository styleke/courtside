name: Review free score sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/free-score-source-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check a documented day endpoint and two observed match identifiers
        run: |
          mkdir -p review
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const urls=[['day-fixtures','https://sportscore.com/api/v1/fixtures/?sport=tennis&date=2026-10-11&limit=200'],['incomplete-result','https://sportscore.com/api/widget/match/?sport=tennis&slug=arthur-gea-vs-ben-shelton'],['normal-result','https://sportscore.com/api/widget/match/?sport=tennis&slug=adrian-mannarino-vs-karen-khachanov']];
          const report={at:new Date().toISOString(),productionModified:false,continuousCollectionEnabled:false,rows:[]};
          for(const [id,url] of urls){
            const row={id,url};
            try{
              const r=await fetch(url,{headers:{'User-Agent':'CourtsideSourceReview/1.0 (https://courtside-tennis.pages.dev/)'},redirect:'error',signal:AbortSignal.timeout(15000)});row.status=r.status;row.contentType=r.headers.get('content-type');
              if(r.ok){const text=await r.text();if(text.length>2500000)throw Error('Diagnostic payload too large');await writeFile('review/'+id+'.json',text);row.bytes=text.length;
                const json=JSON.parse(text);row.keys=Object.keys(json);const matches=json.matches||json.fixtures||json.data;
                if(Array.isArray(matches)){row.count=matches.length;row.competitions=[...new Set(matches.map(x=>x.competition?.name||x.competition||x.league?.name))];row.sample=matches.slice(0,2);row.beijing=matches.filter(x=>/beijing|china open/i.test(JSON.stringify(x))).slice(0,5);}
                else row.detail=json;
              }else await r.body?.cancel();
            }catch(e){row.error=String(e.message);}
            report.rows.push(row);await new Promise(r=>setTimeout(r,750));
          }
          console.log(JSON.stringify(report,null,2));await writeFile('review/summary.json',JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-score-source-review
          path: review
          retention-days: 1
