name: Review independent ranking provenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ranking-independent-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-independent-ranking-audit
  cancel-in-progress: false
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test the inactive free clock and every existing feature
        run: |
          mkdir -p /tmp/independent-rank-review
          npm test > /tmp/independent-rank-review/tests.txt
          tail -n 12 /tmp/independent-rank-review/tests.txt
          npm run build
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - name: Read the final visible federation value, not the lazy-load or animation placeholder
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import {writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const out='/tmp/independent-rank-review',browser=await chromium.launch();
          const record={url:'https://www.itftennis.com/en/players/daniil-medvedev/800321548/rus/mt/s/overview/',startedAt:new Date().toISOString(),productionChanged:false,clockDeployed:false};
          try{const page=await browser.newPage({viewport:{width:1440,height:1000}});const r=await page.goto(record.url,{waitUntil:'domcontentloaded',timeout:25000});record.status=r.status();if(r.status()!==200)throw Error('HTTP '+r.status());const decline=page.locator('#onetrust-reject-all-handler');if(await decline.isVisible())await decline.click();const current=page.getByText('Current rankings',{exact:true}).first();await current.waitFor({timeout:15000});await current.scrollIntoViewIfNeeded();await page.waitForTimeout(2500);record.firstText=await page.locator('body').innerText();await page.waitForTimeout(1000);record.text=await page.locator('body').innerText();record.stable=record.firstText===record.text;const html=await page.content();record.sha256=createHash('sha256').update(html).digest('hex');await writeFile(out+'/itf-medvedev.html',html);await page.screenshot({path:out+'/itf-medvedev.png'});}catch(e){record.error=String(e.message).slice(0,300);}finally{record.finishedAt=new Date().toISOString();await writeFile(out+'/itf-review.json',JSON.stringify(record,null,2));await browser.close();}
          NODE
      - name: Existing public ranking and match screens are unaffected
        run: |
          REPORT_DIR=/tmp/independent-rank-review/ranking-live node scripts/browser-ranking-evidence.mjs
          REPORT_DIR=/tmp/independent-rank-review/profile-live node scripts/browser-profile-acceptance.mjs
      - name: No public information, source admission or clock activation changes
        if: always()
        run: |
          git diff --exit-code -- data config public
          node -e 'const c=require("./ops/cloudflare-clock/wrangler.json");if(c.triggers.crons.length||c.vars.TIMER_ENABLED!=="false"||c.vars.FREE_ONLY_CONFIRMED!=="false")process.exit(1)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-ranking-review
          path: /tmp/independent-rank-review/
          retention-days: 1
