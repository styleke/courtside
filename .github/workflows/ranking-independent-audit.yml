name: Review independent ranking provenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ranking-independent-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-independent-ranking-audit
  cancel-in-progress: false
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Capture the precise current source and openly licensed tabular revision
        run: |
          mkdir -p /tmp/independent-rank-review
          git archive --format=zip HEAD > /tmp/independent-rank-review/source.zip
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const out='/tmp/independent-rank-review';
          const url='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',format:'json',formatversion:'2',prop:'revisions',titles:'Data:ATP singles ranking.tab',rvprop:'ids|timestamp|comment|content',rvslots:'main',rvlimit:'1',maxlag:'5'});
          const record={url,startedAt:new Date().toISOString(),productionChanged:false};
          try{const r=await fetch(url,{headers:{'User-Agent':'CourtsideRankingReview/1.0 (https://courtside-tennis.pages.dev/; finite CC0 revision review)'},redirect:'error',signal:AbortSignal.timeout(20000)});record.status=r.status;if(!r.ok){await r.body?.cancel();throw Error('HTTP '+r.status);}const reader=r.body.getReader(),parts=[];let size=0;for(;;){const {value,done}=await reader.read();if(done)break;size+=value.length;if(size>2000000){await reader.cancel();throw Error('Size limit');}parts.push(Buffer.from(value));}const body=Buffer.concat(parts);record.bytes=body.length;record.sha256=createHash('sha256').update(body).digest('hex');await writeFile(out+'/commons.json',body);}catch(e){record.error=e.message;}record.finishedAt=new Date().toISOString();await writeFile(out+'/commons-request.json',JSON.stringify(record,null,2));
          NODE
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - name: Inspect a current official profile with its visible ranking date
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import {writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const out='/tmp/independent-rank-review',browser=await chromium.launch();
          const record={url:'https://www.itftennis.com/en/players/daniil-medvedev/800321548/rus/mt/s/overview/',startedAt:new Date().toISOString(),productionChanged:false};
          try{const page=await browser.newPage({viewport:{width:1440,height:1000}});const r=await page.goto(record.url,{waitUntil:'domcontentloaded',timeout:25000});record.status=r.status();if(r.status()!==200)throw Error('HTTP '+r.status());const decline=page.locator('#onetrust-reject-all-handler');if(await decline.isVisible())await decline.click();await page.getByText('Current rankings',{exact:true}).first().waitFor({timeout:15000});const html=await page.content();record.sha256=createHash('sha256').update(html).digest('hex');record.text=await page.locator('body').innerText();await writeFile(out+'/itf-medvedev.html',html);await page.getByText('Current rankings',{exact:true}).first().scrollIntoViewIfNeeded();await page.screenshot({path:out+'/itf-medvedev.png'});}catch(e){record.error=String(e.message).slice(0,300);}finally{record.finishedAt=new Date().toISOString();await writeFile(out+'/itf-review.json',JSON.stringify(record,null,2));await browser.close();}
          NODE
      - name: Do not modify data, source admission or website files
        if: always()
        run: git diff --exit-code -- data config public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-ranking-review
          path: /tmp/independent-rank-review/
          retention-days: 1
