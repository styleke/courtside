name: Review post-clock data intake
on:
  push:
    branches: ['review/ranking-schedule-gates-20261013']
permissions:
  contents: read
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 71708e8941a33ec257218eb740c1772eb3794219
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test exact candidate without source changes
        shell: bash
        run: |
          mkdir -p phase2/intake-check
          git rev-parse HEAD > phase2/intake-check/commit.txt
          npm test | tee phase2/intake-check/tests.txt
          git diff --exit-code
      - name: Check actual free ranking responses without publication
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          COURTSIDE_BDL_FREE_CONFIRMED: 'true'
        run: node scripts/review-free-rankings.mjs
      - name: Verify finite live regression against the already reviewed issue
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const r=JSON.parse(await readFile('phase2/free-ranking-review/report.json','utf8'));
          const s=JSON.parse(await readFile('phase2/free-ranking-review/summary.json','utf8'));
          assert.equal(r.status,'review-only','Configured live requests are required');
          assert.ok(r.requests.length>=2&&r.requests.length<=4);
          assert.ok(r.requests.every(q=>q.status===200));
          const w=s.tours.find(t=>t.tour==='WTA'),a=s.tours.find(t=>t.tour==='ATP');
          assert.equal(w.sourceIssueDate,'2026-10-12');
          assert.equal(w.identifiedRows,100);assert.equal(w.differences.length,0);
          assert.equal(w.providerMatchesReviewedIssue,true);
          assert.equal(w.countryLabelsPreserved.length,2);
          assert.equal(a.decision,'blocked');assert.equal(a.differences.length,11);
          assert.equal(s.publicDataWritten,false);assert.equal(s.automaticPublication,false);
          console.log(JSON.stringify(s));
          JS
          git diff --exit-code
      - name: Build exact candidate
        shell: bash
        run: npm run build | tee phase2/intake-check/build.txt
      - name: Verify generated files against committed factual inputs
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import Runtime from './public/runtime.js';
          const original=JSON.parse(execFileSync('git',['show','HEAD:data/content.json'],{encoding:'utf8'}));
          assert.deepEqual(JSON.parse(await fs.readFile('data/content.json','utf8')),original);
          const data=Runtime.publicData(original);
          const seed='window.COURTSIDE_SEED = '+JSON.stringify(data).replace(/</g,'\\u003c')+';';
          assert.equal(await fs.readFile('public/data.js','utf8'),seed);
          assert.equal(await fs.readFile('dist/site/data.js','utf8'),seed);
          assert.deepEqual(JSON.parse(await fs.readFile('dist/site/data/content.json','utf8')),data);
          await fs.writeFile('public/data.js',execFileSync('git',['show','HEAD:public/data.js']));
          const originalStatus=execFileSync('git',['show','HEAD:data/automation-status.json']);
          const a=JSON.parse(originalStatus),b=JSON.parse(await fs.readFile('data/automation-status.json','utf8'));
          delete a.generatedAt;delete b.generatedAt;assert.deepEqual(a,b);
          await fs.writeFile('data/automation-status.json',originalStatus);
          assert.equal(execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim(),'');
          const tests=await fs.readFile('phase2/intake-check/tests.txt','utf8');
          assert.match(tests,/# tests 557\b/);assert.match(tests,/# pass 557\b/);assert.match(tests,/# fail 0\b/);
          const report={testedCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),testsPassed:557,buildPassed:true,liveFreeReviewPassed:true,trackedFilesUnchanged:true,generatedSeedVerified:true,published:false,newRankingPeriodicAcceptance:false};
          await fs.writeFile('phase2/intake-check/verification.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          JS
      - name: Preserve data and every collection permission
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-intake-exact-candidate
          path: |
            phase2/intake-check
            phase2/free-ranking-review
          retention-days: 1
