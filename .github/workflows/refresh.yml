name: Check tennis data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh.yml']
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-refresh
  cancel-in-progress: false
jobs:
  results:
    if: github.event.repository.private == false
    uses: ./.github/workflows/sync-known-results.yml
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
  discovery:
    if: github.event.repository.private == false
    uses: ./.github/workflows/stage-fixture-discovery.yml
    permissions:
      contents: read
